# SonarQube / SonarCloud analysis configuration.
#
# The server URL and authentication token MUST be supplied by the developer at
# analysis time (never commit a token). See README "SonarQube" for commands.
#
#   mvn clean verify sonar:sonar \
#     -Dsonar.host.url=http://localhost:9000 \
#     -Dsonar.token=YOUR_TOKEN
#
sonar.projectKey=wallet-system
sonar.projectName=Wallet System
sonar.java.source=21

# Reuse the JaCoCo report produced by `mvn verify`.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Coverage is not meaningful for these layers (DTOs, entities, config, bootstrap).
sonar.coverage.exclusions=\
  **/WalletSystemApplication.java,\
  **/config/**,\
  **/dto/**,\
  **/entity/**,\
  **/enums/**
